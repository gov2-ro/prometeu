name: SUMAL - Inspectorul Pădurii

on:
  workflow_dispatch:
  schedule:
  - cron: '0 6 * * 1'  # weekly, Monday 6am UTC

permissions:
  contents: write

concurrency:
  group: sumal-scrape
  cancel-in-progress: true

jobs:
  sumal:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - name: Check out this repo
      uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    - name: Install Python dependencies
      run: pip install -r requirements.txt
    - name: SUMAL - Inspectorul Pădurii
      id: sumal
      run: python sumal-inspectorul-padurii.py --recent
      continue-on-error: true
    - name: Summary
      if: always()
      run: |-
        echo "## SUMAL Scraper" >> $GITHUB_STEP_SUMMARY
        echo "| Scraper | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| SUMAL Inspectorul Pădurii | ${{ steps.sumal.outcome }} |" >> $GITHUB_STEP_SUMMARY
    - name: Commit and push if data changed
      if: always()
      run: |-
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add data/sumal/
        if git diff --staged --quiet; then
          echo "No SUMAL data changes"
          echo "### No data changes" >> $GITHUB_STEP_SUMMARY
          exit 0
        fi
        CHANGED=$(git diff --staged --stat | tail -1)
        git commit -m "SUMAL data update: $(date -u '+%Y-%m-%d %H:%M')"
        git push origin main
        echo "### Committed: $CHANGED" >> $GITHUB_STEP_SUMMARY
